name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev cmake libffi-dev libssl-dev \
            python3-pip python3-dev
          pip3 install --upgrade buildozer cython pillow setuptools wheel --quiet

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTextTranslator-APK
          path: bin/*.apk